name: daily-forecast

on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC, before the 12:00 CET gate closure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    # A cold ingest with API retries takes ~45 min; anything longer is stuck, not slow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,entsoe]"
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Ingest, rebuild features, forecast tomorrow
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python -m powercast.pipeline daily
      # Save even when the forecast fails, so a cold download is never repeated from scratch.
      - name: Save raw data cache
        if: always() && hashFiles('data/raw/*.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
      - run: pytest -q
      - name: Commit the new forecast
        run: |
          git config user.name "powercast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/forecast_latest.parquet
          git commit -m "forecast $(date -u +%F)" || echo "no change"
          # main can move during a long run; replay the forecast commit on top (keeping our
          # forecast file on conflict) and retry in case of another push in between.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
